<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#AF7C30" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#75551F" media="(prefers-color-scheme: dark)">
    <script src="../assets/js/theme.js"></script>
    <title data-i18n="driveTest.title"></title>
    <style>
        :root {
            color-scheme: light;
            --bg: #AF7C30;
            --ink: #2A1815;
            --paper: #FFF9F0;
            --line: #7C5F43;
            --ok: #657546;
            --error: #79253E
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #75551F;
            --ink: #F4E8D8;
            --paper: #80602A;
            --line: #9B8069;
            --ok: #B5C58F;
            --error: #DCA077
        }

        body {
            font: 16px/1.5 system-ui, sans-serif;
            max-width: 720px;
            margin: 0 auto;
            padding: 20px;
            background: var(--bg);
            color: var(--ink)
        }

        h1 {
            font-size: 1.6rem
        }

        li {
            margin: 8px 0;
            padding: 10px 12px;
            background: var(--paper);
            border-radius: 10px;
            list-style: none;
            border-left: 6px solid var(--line)
        }

        li.ok {
            border-color: var(--ok)
        }

        li.ko {
            border-color: var(--error)
        }

        ol {
            padding: 0
        }

        small {
            display: block;
            opacity: .75;
            word-break: break-word
        }

        img {
            height: 70px;
            margin: 6px 6px 0 0;
            border-radius: 6px;
            vertical-align: middle
        }
    </style>
</head>

<body>
    <h1 data-i18n="driveTest.title"></h1>
    <p data-i18n="driveTest.intro"></p>
    <ol id="log"></ol>
    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/config.js"></script>
    <script>
        const log = (ok, t, d = '') => { const li = document.createElement('li'); li.className = ok ? 'ok' : 'ko'; li.innerHTML = (ok ? '✓ ' : '✗ ') + t + (d ? `<small>${d}</small>` : ''); document.getElementById('log').append(li); return li };
        const C = (window.SITO || {}).drive || {};
        const api = async (q, campi = 'files(id,name,mimeType)') => { const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=${encodeURIComponent(campi)}&pageSize=200&key=${C.apiKey}`, { referrerPolicy: 'no-referrer-when-downgrade' }); const j = await r.json().catch(() => ({})); if (!r.ok) { const e = new Error(j.error && j.error.message || I18N.t('driveTest.httpStatus', { status: r.status })); e.status = r.status; e.reason = (j.error && j.error.errors && j.error.errors[0] && j.error.errors[0].reason) || ''; throw e } return j.files || [] };
        const aiuto = e => {
            const m = (e.message + ' ' + e.reason).toLowerCase();
            if (m.includes('referer')) return I18N.t('driveTest.refererHelp', { origin: location.origin });
            if (m.includes('api key not valid') || m.includes('keyinvalid')) return I18N.t('driveTest.invalidKeyHelp');
            if (m.includes('has not been used') || m.includes('disabled') || m.includes('accessnotconfigured')) return I18N.t('driveTest.apiDisabledHelp');
            if (m.includes('not found') || e.status === 404) return I18N.t('driveTest.folderHelp');
            if (m.includes('blocked') || m.includes('restricted')) return I18N.t('driveTest.restrictedHelp');
            return I18N.t('driveTest.unknownError')
        };
        (async () => {
            log(true, I18N.t('driveTest.address'), location.origin);
            if (!C.apiKey) { log(false, I18N.t('driveTest.noKey'), I18N.t('driveTest.noKeyDetails')); return }
            log(true, I18N.t('driveTest.keyPresent'), C.apiKey.slice(0, 6) + I18N.t('driveTest.folderValue', { folder: C.cartella }));
            let sub;
            try { sub = await api(`'${C.cartella}' in parents and trashed=false`); log(true, I18N.t('driveTest.folderReachable'), sub.length ? sub.map(x => x.name + (x.mimeType.endsWith('folder') ? '/' : '')).join(', ') : I18N.t('driveTest.unknownFolder')) }
            catch (e) { log(false, I18N.t('driveTest.cannotRead'), `${e.message}<br><b>${aiuto(e)}</b>`); return }
            const norm = s => s.trim().toLowerCase(), fold = x => x.mimeType === 'application/vnd.google-apps.folder';
            const foto = sub.find(x => fold(x) && norm(x.name) === 'foto'); log(!!foto, foto ? I18N.t('driveTest.folderFound') : I18N.t('driveTest.folderMissing'), I18N.t('driveTest.subfoldersTip'));
            let liv = foto ? await api(`'${foto.id}' in parents and trashed=false`) : sub; liv = liv.filter(fold);
            let primo = null;
            for (const nome of ['home', 'commissioni', 'ritrattini', 'editoriali']) {
                const c = liv.find(x => norm(x.name) === nome || norm(x.name).startsWith(nome)); if (!c) { log(false, I18N.t('driveTest.folderNotFound', { name: nome }), I18N.t('driveTest.foldersFound', { names: liv.map(x => x.name).join(', ') || I18N.t('driveTest.noneFound') })); continue }
                const f = await api(`'${c.id}' in parents and trashed=false`, 'files(id,name,mimeType,thumbnailLink)'); const im = f.filter(x => x.mimeType && x.mimeType.startsWith('image/')), altri = f.filter(x => !im.includes(x));
                log(im.length > 0, I18N.t('driveTest.usablePhotos', { name: nome, count: im.length }), (im.slice(0, 4).map(x => x.name).join(', ') || '') + (altri.length ? I18N.t('driveTest.unusablePhotos', { files: altri.map(x => x.name + ' [' + x.mimeType + ']').join(', ') }) : ''));
                if (!primo && im[0]) primo = im[0];
            }
            if (!primo) { log(false, I18N.t('driveTest.noPhotos')); return }
            const prove = [[I18N.t('driveTest.thumbnailApi'), primo.thumbnailLink && primo.thumbnailLink.replace(/=s\d+.*$/, '=w400')], [I18N.t('driveTest.googleusercontent'), `https://lh3.googleusercontent.com/d/${primo.id}=w400`], [I18N.t('driveTest.driveThumbnail'), `https://drive.google.com/thumbnail?id=${primo.id}&sz=w400`]];
            for (const [n, u] of prove) { if (!u) continue; const li = log(false, I18N.t('driveTest.loadingImage', { name: primo.name, method: n }), I18N.t('driveTest.inProgress')); await new Promise(ok => { const i = new Image(); i.referrerPolicy = 'no-referrer'; i.onload = () => { li.className = 'ok'; li.firstChild.textContent = '✓ '; li.querySelector('small').innerHTML = I18N.t('driveTest.works'); li.append(i); ok() }; i.onerror = () => { li.querySelector('small').textContent = I18N.t('driveTest.imageFailed'); ok() }; i.src = u }) }
        })().catch(e => log(false, I18N.t('driveTest.unexpected'), e.message));
    </script>
</body>

</html>
