<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#AF7C30" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#75551F" media="(prefers-color-scheme: dark)">
    <script src="../assets/js/theme.js"></script>
    <title data-i18n="driveTest.title"></title>
    <style>
        :root {
            color-scheme: light;
            --bg: #AF7C30;
            --ink: #2A1815;
            --paper: #FFF9F0;
            --line: #7C5F43;
            --ok: #657546;
            --error: #79253E
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #75551F;
            --ink: #F4E8D8;
            --paper: #80602A;
            --line: #9B8069;
            --ok: #B5C58F;
            --error: #DCA077
        }

        body {
            font: 16px/1.5 system-ui, sans-serif;
            max-width: 720px;
            margin: 0 auto;
            padding: 20px;
            background: var(--bg);
            color: var(--ink)
        }

        h1 {
            font-size: 1.6rem
        }

        li {
            margin: 8px 0;
            padding: 10px 12px;
            background: var(--paper);
            border-radius: 10px;
            list-style: none;
            border-left: 6px solid var(--line)
        }

        li.ok {
            border-color: var(--ok)
        }

        li.ko {
            border-color: var(--error)
        }

        ol {
            padding: 0
        }

        small {
            display: block;
            opacity: .75;
            word-break: break-word
        }

        img {
            height: 70px;
            margin: 6px 6px 0 0;
            border-radius: 6px;
            vertical-align: middle
        }
    </style>
</head>

<body>
    <h1 data-i18n="driveTest.title"></h1>
    <p data-i18n="driveTest.intro"></p>
    <ol id="log"></ol>
    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/config.js"></script>
    <script>
        const driveConfiguration = (window.SITO || {}).drive || {};

        // Append a success or failure entry to the Drive diagnostic log.
        const appendLog = (success, title, details = '') => {
            const listItem = document.createElement('li');
            listItem.className = success ? 'ok' : 'ko';
            listItem.innerHTML =
                (success ? '✓ ' : '✗ ') +
                title +
                (details ? `<small>${details}</small>` : '');
            document.getElementById('log').append(listItem);
            return listItem;
        };

        // Fetch a Drive query and return its files or a descriptive error.
        const fetchDriveTestFiles = async (
            query,
            fields = 'files(id,name,mimeType)',
        ) => {
            const driveResponse = await fetch(
                `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=${encodeURIComponent(fields)}&pageSize=200&key=${driveConfiguration.apiKey}`,
                { referrerPolicy: 'no-referrer-when-downgrade' },
            );
            const driveData = await driveResponse.json().catch(() => ({}));

            if (!driveResponse.ok) {
                const driveError = new Error(
                    driveData.error?.message ||
                    I18N.t('driveTest.httpStatus', { status: driveResponse.status }),
                );
                driveError.status = driveResponse.status;
                driveError.reason =
                    driveData.error?.errors?.[0]?.reason || '';
                throw driveError;
            }

            return driveData.files || [];
        };

        // Convert a Drive API error into a useful setup hint.
        const getDriveErrorHint = error => {
            const errorText =
                `${error.message} ${error.reason}`.toLowerCase();

            if (errorText.includes('referer')) {
                return I18N.t('driveTest.refererHelp', { origin: location.origin });
            }
            if (errorText.includes('api key not valid') || errorText.includes('keyinvalid')) {
                return I18N.t('driveTest.invalidKeyHelp');
            }
            if (
                errorText.includes('has not been used') ||
                errorText.includes('disabled') ||
                errorText.includes('accessnotconfigured')
            ) {
                return I18N.t('driveTest.apiDisabledHelp');
            }
            if (errorText.includes('not found') || error.status === 404) {
                return I18N.t('driveTest.folderHelp');
            }
            if (errorText.includes('blocked') || errorText.includes('restricted')) {
                return I18N.t('driveTest.restrictedHelp');
            }
            return I18N.t('driveTest.unknownError');
        };

        // Normalize a folder name and recognize Google Drive folder MIME types.
        const normalizeFolderName = name => name.trim().toLowerCase();
        const isFolder = file =>
            file.mimeType === 'application/vnd.google-apps.folder';

        // Run the complete Drive configuration diagnostic.
        const runDriveTest = async () => {
            appendLog(true, I18N.t('driveTest.address'), location.origin);

            if (!driveConfiguration.apiKey) {
                appendLog(
                    false,
                    I18N.t('driveTest.noKey'),
                    I18N.t('driveTest.noKeyDetails'),
                );
                return;
            }

            appendLog(
                true,
                I18N.t('driveTest.keyPresent'),
                driveConfiguration.apiKey.slice(0, 6) +
                    I18N.t('driveTest.folderValue', {
                        folder: driveConfiguration.cartella,
                    }),
            );

            let rootFiles;
            try {
                rootFiles = await fetchDriveTestFiles(
                    `'${driveConfiguration.cartella}' in parents and trashed=false`,
                );
                appendLog(
                    true,
                    I18N.t('driveTest.folderReachable'),
                    rootFiles.length
                        ? rootFiles
                            .map(file =>
                                file.name +
                                (file.mimeType.endsWith('folder') ? '/' : ''),
                            )
                            .join(', ')
                        : I18N.t('driveTest.unknownFolder'),
                );
            } catch (error) {
                appendLog(
                    false,
                    I18N.t('driveTest.cannotRead'),
                    `${error.message}<br><b>${getDriveErrorHint(error)}</b>`,
                );
                return;
            }

            const photoFolder = rootFiles.find(
                file =>
                    isFolder(file) &&
                    normalizeFolderName(file.name) === 'foto',
            );
            appendLog(
                !!photoFolder,
                photoFolder
                    ? I18N.t('driveTest.folderFound')
                    : I18N.t('driveTest.folderMissing'),
                I18N.t('driveTest.subfoldersTip'),
            );

            let sectionFolders = photoFolder
                ? await fetchDriveTestFiles(
                    `'${photoFolder.id}' in parents and trashed=false`,
                )
                : rootFiles;
            sectionFolders = sectionFolders.filter(isFolder);
            let firstPhoto = null;

            for (const sectionName of [
                'home',
                'commissioni',
                'ritrattini',
                'editoriali',
            ]) {
                const sectionFolder = sectionFolders.find(
                    file =>
                        normalizeFolderName(file.name) === sectionName ||
                        normalizeFolderName(file.name).startsWith(sectionName),
                );

                if (!sectionFolder) {
                    appendLog(
                        false,
                        I18N.t('driveTest.folderNotFound', {
                            name: sectionName,
                        }),
                        I18N.t('driveTest.foldersFound', {
                            names:
                                sectionFolders
                                    .map(file => file.name)
                                    .join(', ') ||
                                I18N.t('driveTest.noneFound'),
                        }),
                    );
                    continue;
                }

                const sectionFiles = await fetchDriveTestFiles(
                    `'${sectionFolder.id}' in parents and trashed=false`,
                    'files(id,name,mimeType,thumbnailLink)',
                );
                const images = sectionFiles.filter(
                    file =>
                        file.mimeType &&
                        file.mimeType.startsWith('image/'),
                );
                const otherFiles = sectionFiles.filter(
                    file => !images.includes(file),
                );

                appendLog(
                    images.length > 0,
                    I18N.t('driveTest.usablePhotos', {
                        name: sectionName,
                        count: images.length,
                    }),
                    (images
                        .slice(0, 4)
                        .map(file => file.name)
                        .join(', ') || '') +
                        (otherFiles.length
                            ? I18N.t('driveTest.unusablePhotos', {
                                files: otherFiles
                                    .map(
                                        file =>
                                            file.name +
                                            ' [' +
                                            file.mimeType +
                                            ']',
                                    )
                                    .join(', '),
                            })
                            : ''),
                );

                if (!firstPhoto && images[0]) firstPhoto = images[0];
            }

            if (!firstPhoto) {
                appendLog(false, I18N.t('driveTest.noPhotos'));
                return;
            }

            const imageTests = [
                [
                    I18N.t('driveTest.thumbnailApi'),
                    firstPhoto.thumbnailLink &&
                        firstPhoto.thumbnailLink.replace(/=s\d+.*$/, '=w400'),
                ],
                [
                    I18N.t('driveTest.googleusercontent'),
                    `https://lh3.googleusercontent.com/d/${firstPhoto.id}=w400`,
                ],
                [
                    I18N.t('driveTest.driveThumbnail'),
                    `https://drive.google.com/thumbnail?id=${firstPhoto.id}&sz=w400`,
                ],
            ];

            for (const [testName, imageUrl] of imageTests) {
                if (!imageUrl) continue;

                const listItem = appendLog(
                    false,
                    I18N.t('driveTest.loadingImage', {
                        name: firstPhoto.name,
                        method: testName,
                    }),
                    I18N.t('driveTest.inProgress'),
                );

                await new Promise(resolve => {
                    const testImage = new Image();
                    testImage.referrerPolicy = 'no-referrer';
                    testImage.onload = () => {
                        listItem.className = 'ok';
                        listItem.firstChild.textContent = '✓ ';
                        listItem.querySelector('small').innerHTML =
                            I18N.t('driveTest.works');
                        listItem.append(testImage);
                        resolve();
                    };
                    testImage.onerror = () => {
                        listItem.querySelector('small').textContent =
                            I18N.t('driveTest.imageFailed');
                        resolve();
                    };
                    testImage.src = imageUrl;
                });
            }
        };

        runDriveTest().catch(error =>
            appendLog(
                false,
                I18N.t('driveTest.unexpected'),
                error.message,
            ),
        );
    </script>
</body>

</html>
